<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Iris // Account</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/fonts.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Computer Modern Sans", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #dddddd;
        background-color: #151515;
        padding: 4rem 6rem;
      }

      h1 {
        font-size: 28px;
        text-transform: uppercase;
        font-weight: lighter;
        letter-spacing: 0.1em;
        color: #dddddd;
        margin-bottom: 0.25rem;
      }

      .subtitle {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #665c54;
        margin-bottom: 1.75rem;
      }

      hr {
        border: none;
        height: 0.1em;
        background-color: #50665a;
        margin-bottom: 1.5rem;
      }

      .nav {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 2rem;
        display: flex;
        gap: 1.5rem;
      }

      .nav a {
        color: #665c54;
        text-decoration: none;
      }

      .nav a:hover {
        color: #a89984;
      }

      .section-header {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #8bb39d;
        padding-bottom: 0.4rem;
        border-bottom: 1px solid #3c3836;
        margin-bottom: 1rem;
        margin-top: 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      button.refresh {
        background: #1d2021;
        border: 1px solid #3c3836;
        color: #665c54;
        font-family: "Computer Modern Sans", sans-serif;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 0.2rem 0.6rem;
        cursor: pointer;
      }

      button.refresh:hover {
        color: #a89984;
        border-color: #665c54;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .summary-grid.two-metric {
        grid-template-columns: repeat(2, 1fr);
      }

      .metric.pending .value {
        color: #665c54;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-family: "Computer Modern Sans", sans-serif;
      }

      .metric {
        background: #1d2021;
        border: 1px solid #3c3836;
        padding: 1rem 1.25rem;
      }

      .metric .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #665c54;
        margin-bottom: 0.4rem;
      }

      .metric .value {
        font-size: 22px;
        font-family: "Computer Modern Typewriter", monospace;
        color: #ebdbb2;
      }

      .metric .value.cash {
        color: #98971a;
      }
      .metric .value.portfolio {
        color: #689d6a;
      }

      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3rem;
      }

      .two-col.single-col {
        grid-template-columns: 1fr;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #665c54;
        padding: 0.4rem 0.5rem;
        border-bottom: 1px solid #3c3836;
      }

      td {
        padding: 0.4rem 0.5rem;
        font-size: 13px;
        font-family: "Computer Modern Typewriter", monospace;
        border-bottom: 1px solid #232323;
      }

      th.right,
      td.right {
        text-align: right;
      }

      td.label-col {
        font-family: "Computer Modern Sans", sans-serif;
        color: #d5c4a1;
      }

      .pill {
        display: inline-block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 0.1rem 0.4rem;
        border: 1px solid;
      }

      .pill.buy,
      .pill.deposit {
        color: #98971a;
        border-color: #98971a;
      }

      .pill.sell,
      .pill.withdrawal {
        color: #cc241d;
        border-color: #cc241d;
      }

      .empty {
        color: #665c54;
        font-size: 13px;
        font-family: "Computer Modern Typewriter", monospace;
        padding: 0.5rem 0;
      }

      .loading {
        color: #665c54;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a href="/">console</a>
      <a href="/dashboard">dashboard</a>
    </nav>
    <h1 id="account-name">iris // account</h1>
    <div class="subtitle" id="timestamp">loading...</div>
    <hr />

    <div class="summary-grid" id="summary">
      <div class="metric">
        <div class="label">type</div>
        <div class="value loading">--</div>
      </div>
      <div class="metric">
        <div class="label">balance / cost basis</div>
        <div class="value loading">--</div>
      </div>
      <div class="metric">
        <div class="label">positions</div>
        <div class="value loading">--</div>
      </div>
    </div>

    <div class="two-col" id="detail-sections">
      <div id="holdings-section">
        <div class="section-header">
          holdings
          <button class="refresh" onclick="load()">refresh</button>
        </div>
        <div id="holdings-container"><div class="loading">loading...</div></div>
      </div>
      <div>
        <div class="section-header">activity</div>
        <div id="activity-container"><div class="loading">loading...</div></div>
      </div>
    </div>

    <script src="/static/domain.js"></script>
    <script src="/static/api.js"></script>
    <script src="/static/format.js"></script>
    <script src="/static/accounts/view.js"></script>
  </body>
</html>
