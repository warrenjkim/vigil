<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Iris // Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/fonts.css"
    />
    <link rel="stylesheet" href="/static/iris.css" />
    <style>
      .accounts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }

      .account-card {
        background: #1d2021;
        border: 1px solid #3c3836;
        padding: 1rem 1.25rem;
      }

      .account-card,
      .account-card:visited,
      .account-card:hover {
        text-decoration: none;
      }

      .account-card .account-name {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #d5c4a1;
        margin-bottom: 0.1rem;
      }

      .account-card .account-type {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #665c54;
        margin-bottom: 0.6rem;
      }

      .account-card .account-value {
        font-size: 18px;
        font-family: "Computer Modern Typewriter", monospace;
        color: #ebdbb2;
      }

      .account-card .account-name,
      .account-card .account-value {
        transition: color 0.15s ease;
      }

      .account-card:hover .account-name,
      .account-card:hover .account-value {
        color: #689d6a;
      }

      .account-card .account-sub {
        font-size: 11px;
        color: #665c54;
        margin-top: 0.2rem;
      }

      .error {
        color: #cc241d;
        font-size: 13px;
        font-family: "Computer Modern Typewriter", monospace;
        padding: 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a href="/console">console</a>
      <a href="/dashboard" class="active">dashboard</a>
    </nav>
    <h1>iris // dashboard</h1>
    <div class="subtitle" id="timestamp">loading...</div>
    <hr />

    <div class="summary-grid" id="summary">
      <div class="metric">
        <div class="label">total cash</div>
        <div class="value cash loading">--</div>
      </div>
      <div class="metric">
        <div class="label">portfolio cost basis</div>
        <div class="value portfolio loading">--</div>
      </div>
      <div class="metric">
        <div class="label">net worth (est.)</div>
        <div class="value loading">--</div>
      </div>
    </div>

    <div class="section-header">
      accounts
      <button class="refresh" id="refresh-button">refresh</button>
    </div>
    <div class="accounts-grid" id="accounts-grid">
      <div class="loading">loading...</div>
    </div>

    <div class="two-col">
      <div>
        <div class="section-header">holdings</div>
        <div id="holdings-container"><div class="loading">loading...</div></div>
      </div>
      <div>
        <div class="section-header">recent activity</div>
        <div id="activity-container"><div class="loading">loading...</div></div>
      </div>
    </div>

    <script type="module" src="/static/dashboard.js"></script>
  </body>
</html>
