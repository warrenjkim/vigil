<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Iris // Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/fonts.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Computer Modern Sans", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #dddddd;
        background-color: #151515;
        padding: 4rem 6rem;
      }

      h1 {
        font-size: 28px;
        text-transform: uppercase;
        font-weight: lighter;
        letter-spacing: 0.1em;
        color: #dddddd;
        margin-bottom: 0.25rem;
      }

      .subtitle {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #665c54;
        margin-bottom: 1.75rem;
      }

      hr {
        border: none;
        height: 0.1em;
        background-color: #50665a;
        margin-bottom: 1.5rem;
      }

      .section-header {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #8bb39d;
        padding-bottom: 0.4rem;
        border-bottom: 1px solid #3c3836;
        margin-bottom: 1rem;
        margin-top: 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .metric {
        background: #1d2021;
        border: 1px solid #3c3836;
        padding: 1rem 1.25rem;
      }

      .metric .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #665c54;
        margin-bottom: 0.4rem;
      }

      .metric .value {
        font-size: 22px;
        font-family: "Computer Modern Typewriter", monospace;
        color: #ebdbb2;
      }

      .metric .value.cash {
        color: #98971a;
      }
      .metric .value.portfolio {
        color: #689d6a;
      }

      .accounts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }

      .account-card {
        background: #1d2021;
        border: 1px solid #3c3836;
        padding: 1rem 1.25rem;
      }

      .account-card,
      .account-card:visited,
      .account-card:hover {
        text-decoration: none;
      }

      .account-card .account-name {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #d5c4a1;
        margin-bottom: 0.1rem;
      }

      .account-card .account-type {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #665c54;
        margin-bottom: 0.6rem;
      }

      .account-card .account-value {
        font-size: 18px;
        font-family: "Computer Modern Typewriter", monospace;
        color: #ebdbb2;
      }

      .account-card .account-name,
      .account-card .account-value {
        transition: color 0.15s ease;
      }

      .account-card:hover .account-name,
      .account-card:hover .account-value {
        color: #689d6a;
      }

      .account-card .account-sub {
        font-size: 11px;
        color: #665c54;
        margin-top: 0.2rem;
      }

      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #665c54;
        font-weight: 400;
        text-align: left;
        padding: 0.35rem 0.5rem 0.35rem 0;
        border-bottom: 1px solid #3c3836;
      }

      td {
        padding: 0.4rem 0.5rem 0.4rem 0;
        border-bottom: 1px solid #1d2021;
        color: #a89984;
        font-family: "Computer Modern Typewriter", monospace;
        vertical-align: middle;
      }

      td.label-col {
        font-family: "Computer Modern Sans", sans-serif;
        color: #d5c4a1;
      }

      td.right,
      th.right {
        text-align: right;
      }

      .pill {
        display: inline-block;
        font-size: 10px;
        font-family: "Computer Modern Sans", sans-serif;
        padding: 1px 6px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border: 1px solid;
      }

      .pill.buy {
        color: #98971a;
        border-color: #665c00;
      }
      .pill.sell {
        color: #cc241d;
        border-color: #79150c;
      }
      .pill.deposit {
        color: #689d6a;
        border-color: #3a5e3b;
      }
      .pill.withdrawal {
        color: #d65d0e;
        border-color: #7a3000;
      }

      .loading {
        color: #665c54;
        font-size: 13px;
        font-family: "Computer Modern Typewriter", monospace;
        padding: 0.5rem 0;
      }

      .error {
        color: #cc241d;
        font-size: 13px;
        font-family: "Computer Modern Typewriter", monospace;
        padding: 0.5rem 0;
      }

      .empty {
        color: #665c54;
        font-size: 13px;
        font-family: "Computer Modern Typewriter", monospace;
        padding: 0.5rem 0;
      }

      .nav {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 2rem;
        display: flex;
        gap: 1.5rem;
      }

      .nav a {
        color: #665c54;
        text-decoration: none;
      }

      .nav a:hover {
        color: #a89984;
      }

      .nav a.active {
        color: #8bb39d;
      }

      button.refresh {
        background: #1d2021;
        border: 1px solid #3c3836;
        color: #665c54;
        font-family: "Computer Modern Sans", sans-serif;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 0.2rem 0.6rem;
        cursor: pointer;
      }

      button.refresh:hover {
        color: #a89984;
        border-color: #665c54;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a href="/">console</a>
      <a href="/dashboard" class="active">dashboard</a>
    </nav>
    <h1>iris // dashboard</h1>
    <div class="subtitle" id="timestamp">loading...</div>
    <hr />

    <div class="summary-grid" id="summary">
      <div class="metric">
        <div class="label">total cash</div>
        <div class="value cash loading">--</div>
      </div>
      <div class="metric">
        <div class="label">portfolio cost basis</div>
        <div class="value portfolio loading">--</div>
      </div>
      <div class="metric">
        <div class="label">net worth (est.)</div>
        <div class="value loading">--</div>
      </div>
    </div>

    <div class="section-header">
      accounts
      <button class="refresh" onclick="load()">refresh</button>
    </div>
    <div class="accounts-grid" id="accounts-grid">
      <div class="loading">loading...</div>
    </div>

    <div class="two-col">
      <div>
        <div class="section-header">holdings</div>
        <div id="holdings-container"><div class="loading">loading...</div></div>
      </div>
      <div>
        <div class="section-header">recent activity</div>
        <div id="activity-container"><div class="loading">loading...</div></div>
      </div>
    </div>

    <script src="/static/api.js"></script>
    <script src="/static/format.js"></script>
    <script src="/static/dashboard.js"></script>
  </body>
</html>
